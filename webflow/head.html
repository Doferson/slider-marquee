<!-- Slider Marquee: поведение, которое не задать в Webflow Designer.
     Вставлять в Page settings → Custom code → Inside <head> tag. -->
<style>
:root {
  --sm-fg: #000;
  --sm-muted: #f5f5f5;
  --sm-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --sm-ease-in-out: cubic-bezier(0.76, 0, 0.24, 1);
}

body {
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* Единое кольцо фокуса с клавиатуры */
:focus-visible {
  outline: 2px solid var(--sm-fg);
  outline-offset: 4px;
}

.slide__img,
.viewer__img {
  max-width: none; /* Webflow по умолчанию ограничивает картинки 100% ширины */
  user-select: none;
  -webkit-user-drag: none;
}

/* ---------- Лента ---------- */

.slider {
  touch-action: pan-y;
  user-select: none;
}

.slider.is-dragging {
  cursor: grabbing;
}

.slide {
  outline: none;
  scale: 1;
  transition: scale 0.9s var(--sm-ease-out);
  will-change: translate, scale;
}

/* Зажатие ленты: карточки слегка уменьшаются */
.slider.is-pressed .slide {
  scale: 0.94;
  transition-duration: 0.5s;
}

/* clip-path на .slide__media срезает её собственный outline,
   поэтому кольцо рисуем отдельным слоем поверх области фото */
.slide:focus-visible {
  outline: none;
}

.slide::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  aspect-ratio: 2 / 3;
  outline: 2px solid transparent;
  outline-offset: 4px;
  pointer-events: none;
}

.slide:focus-visible::after {
  outline-color: var(--sm-fg);
}

.slide__num > * {
  display: block;
  transform: translateY(110%);
}

.slide__media {
  clip-path: inset(100% 0 0 0);
}

.slide__parallax {
  will-change: transform;
}

.slide__img {
  scale: 1;
  transition: scale 1.2s var(--sm-ease-out);
}

.slide.is-hover .slide__img {
  scale: 1.08;
}

/* ---------- Появление: маска раскрывается снизу вверх ---------- */

.is-ready .slide__media {
  animation: sm-mask-reveal 1s var(--sm-ease-in-out) var(--delay, 0s) both;
}

.is-ready .slide__img {
  animation: sm-img-reveal 1.3s var(--sm-ease-out) var(--delay, 0s) both;
}

.is-ready .slide__num > * {
  animation: sm-num-reveal 0.8s var(--sm-ease-out) calc(var(--delay, 0s) + 0.25s) both;
}

.slide.is-static .slide__media,
.slide.is-static .slide__img,
.slide.is-static .slide__num > * {
  animation: none;
  clip-path: none;
  transform: none;
}

@keyframes sm-mask-reveal {
  from { clip-path: inset(100% 0 0 0); }
  to { clip-path: inset(0 0 0 0); }
}

@keyframes sm-img-reveal {
  from { transform: translateY(15%) scale(1.3); }
  to { transform: none; }
}

@keyframes sm-num-reveal {
  from { transform: translateY(110%); }
  to { transform: none; }
}

/* ---------- Открытый слайд ---------- */

.slide.is-active .slide__media {
  visibility: hidden;
}

.viewer {
  visibility: hidden;
  pointer-events: none;
}

.is-open .viewer,
.viewer.is-flying {
  visibility: visible;
}

.is-open .viewer {
  pointer-events: auto;
  touch-action: none; /* свайпы обрабатываем сами, без pull-to-refresh */
}

@media (pointer: fine) {
  .is-open .viewer {
    cursor: none;
  }
}

.viewer__num > * {
  display: block;
  transform: translateY(110%);
  transition: transform 0.5s var(--sm-ease-in-out);
}

.is-open .viewer__num > * {
  transform: none;
  transition: transform 0.8s var(--sm-ease-out) 0.3s;
}

/* ---------- Круг-курсор ---------- */

.cursor {
  pointer-events: none;
  scale: 0;
  transition: scale 0.35s var(--sm-ease-in-out);
  will-change: translate, scale;
}

.is-open .cursor {
  scale: 1;
  transition: scale 0.5s var(--sm-ease-out) 0.35s;
}

.cursor.is-visible {
  scale: 1;
  transition: scale 0.5s var(--sm-ease-out);
}

/* Тач: круга нет — карточки и фото управляются тапами */
.is-touch .cursor {
  display: none;
}

@media (hover: none), (pointer: coarse) {
  .cursor {
    display: none;
  }
}

/* И кольца фокуса на тач тоже нет */
.is-touch :focus-visible {
  outline: none;
}

.is-touch .slide:focus-visible::after {
  outline-color: transparent;
}

/* Над карточкой системный курсор прячем — его заменяет круг */
.slider.is-cursor {
  cursor: none;
}

/* Волна от круга при нажатии — над фоном круга, под подписью */
.cursor::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: 50%;
  background: var(--sm-muted);
  opacity: 0;
  pointer-events: none;
}

/* Подписи меняются через маску: строка-окно, текст въезжает снизу и уходит вверх */
.cursor [data-label] > * {
  display: block;
  transform: translateY(110%);
}

.cursor[data-mode="open"] [data-label="open"] > *,
.cursor[data-mode="close"] [data-label="close"] > *,
.cursor[data-mode="prev"] [data-label="prev"] > *,
.cursor[data-mode="next"] [data-label="next"] > * {
  transform: none;
}

@media (prefers-reduced-motion: reduce) {
  .is-ready .slide__media,
  .is-ready .slide__img,
  .is-ready .slide__num > * {
    animation-duration: 0.01s;
    animation-delay: 0s;
  }
}
</style>
